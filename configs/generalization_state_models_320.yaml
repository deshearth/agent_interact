output: runs/generalization_investigation_320_v1/state_models_v1
reference: runs/compact_arguments_320_v1
common: runs/question_breadth_320_train_v1/predictors/development.npz
context_vectors: runs/question_breadth_320_train_v1/predictors/context_vectors.npz
message_vectors: runs/breadth_arguments_320_v1/data/vectors.npy
message_ids: runs/breadth_arguments_320_v1/data/message_ids.npy
index: runs/question_breadth_320_v1/episode_index.json
variants: [base, order, random_order, history, rich, arguments]
split_seed: 91847
inner_validation_questions: 64
random_seed: 173
training:
  max_leaf_nodes: [7, 15, 31]
  l2_regularization: [1.0, 10.0]
  max_iter: 1000
  learning_rate: 0.05
  min_samples_leaf: 128
  n_iter_no_change: 30
  tolerance: 0.00001
  threads: 4
  max_concurrent_models: 2
evaluation:
  bootstrap_seed: 81948
  bootstrap_replicates: 5000
  selection: Best internal-question NLL; ties use accuracy then fewer iterations.
  primary: Accuracy on all 80 reused validation questions; also report NLL and Brier.

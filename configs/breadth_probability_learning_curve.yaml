project: llama_probability_curve_v1
output: runs/llama_probability_curve_v1
source: runs/question_breadth_v1
curve:
  training_question_counts: [10, 20, 40, 80]
  subset_seeds: [67031, 67032, 67033]
  targets: [hard, soft]
models:
  nano: {d_model: 8, heads: 4, d_k: 1, d_v: 2, ffn_dim: 16}
training:
  refit_seeds: [142, 143, 144]
  learning_rate: 0.001
  output_penalty: 0.001
  fixed_steps: 1280
  dropout: 0.1
  weight_decay: 0.001
  batch_size: 32
  evaluation_batch_size: 256
  validation_every_steps: 128
  gradient_clip: 1.0
  torch_threads: 4
evaluation:
  bootstrap_seed: 67034
  bootstrap_replicates: 5000
  validation_questions: 20
  assessment_questions: 40
  primary: observed_next_opinion_accuracy
  probability_metrics: [expected_error, expected_nll, probability_mean_squared_error]
